{% extends "base.html" %}

{% block title %}Editar Medição - Controle de Pressão Arterial{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white dark:bg-gray-800 rounded-lg shadow-md p-8 transition-colors duration-200">
    <h2 class="text-3xl font-bold text-gray-800 dark:text-white mb-6">
        <i class="fas fa-edit mr-2"></i>Editar Medição
    </h2>

    <form method="POST" action="{{ url_for('editar', id=controle.id) }}">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <div>
                <label class="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2" for="data">
                    Data *
                </label>
                <input type="date" id="data" name="data" required value="{{ controle.data.strftime('%Y-%m-%d') }}"
                    class="shadow appearance-none border border-gray-300 dark:border-gray-600 rounded w-full py-2 px-3 text-gray-700 dark:text-gray-200 bg-white dark:bg-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:border-blue-500 dark:focus:border-blue-400">
            </div>

            <div>
                <label class="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2" for="hora">
                    Hora *
                </label>
                <input type="time" id="hora" name="hora" required value="{{ controle.hora.strftime('%H:%M') }}"
                    class="shadow appearance-none border border-gray-300 dark:border-gray-600 rounded w-full py-2 px-3 text-gray-700 dark:text-gray-200 bg-white dark:bg-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:border-blue-500 dark:focus:border-blue-400">
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
            <div>
                <label class="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2" for="sistolica">
                    Sistólica (mmHg) *
                </label>
                <input type="number" id="sistolica" name="sistolica" min="0" max="300" required
                    value="{{ controle.sistolica }}"
                    class="shadow appearance-none border border-gray-300 dark:border-gray-600 rounded w-full py-2 px-3 text-gray-700 dark:text-gray-200 bg-white dark:bg-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:border-blue-500 dark:focus:border-blue-400"
                    placeholder="120">
            </div>

            <div>
                <label class="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2" for="diastolica">
                    Diastólica (mmHg) *
                </label>
                <input type="number" id="diastolica" name="diastolica" min="0" max="200" required
                    value="{{ controle.diastolica }}"
                    class="shadow appearance-none border border-gray-300 dark:border-gray-600 rounded w-full py-2 px-3 text-gray-700 dark:text-gray-200 bg-white dark:bg-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:border-blue-500 dark:focus:border-blue-400"
                    placeholder="80">
            </div>

            <div>
                <label class="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2" for="frequencia">
                    Frequência (bpm)
                </label>
                <input type="number" id="frequencia" name="frequencia" min="0" max="300"
                    value="{{ controle.frequencia or '' }}"
                    class="shadow appearance-none border border-gray-300 dark:border-gray-600 rounded w-full py-2 px-3 text-gray-700 dark:text-gray-200 bg-white dark:bg-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:border-blue-500 dark:focus:border-blue-400"
                    placeholder="70">
            </div>
        </div>

        <div class="mb-6">
            <label class="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2" for="observacoes">
                Observações
            </label>
            <textarea id="observacoes" name="observacoes" rows="3"
                class="shadow appearance-none border border-gray-300 dark:border-gray-600 rounded w-full py-2 px-3 text-gray-700 dark:text-gray-200 bg-white dark:bg-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:border-blue-500 dark:focus:border-blue-400"
                placeholder="Informações adicionais (opcional)">{{ controle.observacoes or '' }}</textarea>
        </div>

        <div class="flex items-center justify-between">
            <a href="{{ url_for('index') }}"
                class="bg-gray-500 hover:bg-gray-600 dark:bg-gray-600 dark:hover:bg-gray-700 text-white font-bold py-2 px-4 rounded transition">
                <i class="fas fa-arrow-left mr-2"></i>Voltar
            </a>
            <button type="submit"
                class="bg-blue-600 hover:bg-blue-700 dark:bg-blue-700 dark:hover:bg-blue-800 text-white font-bold py-2 px-4 rounded transition">
                <i class="fas fa-save mr-2"></i>Atualizar Medição
            </button>
        </div>
    </form>
</div>
{% endblock %}
